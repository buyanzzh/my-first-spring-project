spring:
    application:
        name: treeapi

    datasource:
        url: jdbc:mysql://localhost:3306/tree?useSSL=false&serverTimezone=Asia/Shanghai
        username: root
        password: root

    data:
        cache:
            type: redis
            redis:
                time-to-live: 600000  # 10分钟
        redis:
            host: localhost
            port: 6379
            timeout: 2000ms
            lettuce:
                pool:
                    max-active: 8

logging:
    level:
        org.springframework: ERROR