spring:
    application:
        name: treeapi

    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver   # 必须是这个，不能是 com.mysql.jdbc.Driver
        url: jdbc:mysql://localhost:3306/tree?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
        username: root
        password: root

    data:
        cache:
            type: redis
            redis:
                time-to-live: 600000  # 10分钟
        redis:
            host: localhost
            port: 6379
            timeout: 2000ms
            lettuce:
                pool:
                    max-active: 8

    profiles:
        active: dev

# ===== 新增以下 MyBatis-Plus 配置 =====
mybatis-plus:
    mapper-locations: classpath*:/mapper/**/*.xml   # XML文件位置（暂时用不到，先保留）
    type-aliases-package: com.entity     # 替换成你实体类所在的包路径
    configuration:
        map-underscore-to-camel-case: true             # 开启驼峰命名自动映射（重要！）
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 控制台打印SQL（调试用）

logging:
    level:
        org.springframework: ERROR

jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
